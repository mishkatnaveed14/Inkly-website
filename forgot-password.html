<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — Inkly</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:wght@700&display=swap" rel="stylesheet">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body class="d-flex align-items-center min-vh-100 py-5">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-5">
        
        <div class="text-center mb-4">
          <a class="brand-logo fs-1" href="index.html">Inkly<span>.</span></a>
          <h2 class="h4 fw-bold mt-3">Reset your password</h2>
          <p class="text-secondary">Enter your account email and we'll send a recovery link.</p>
        </div>

        <div class="card p-4 border-0 shadow-lg rounded-4">
          <div id="alertContainer"></div>

          <form id="resetForm" novalidate>
            <div class="mb-4">
              <label class="form-label fw-medium">Email Address</label>
              <input type="email" id="email" class="form-control form-control-lg rounded-3" placeholder="jane@example.com" required>
            </div>

            <button type="submit" id="submitBtn" class="btn btn-inkly-primary w-100 py-3 mb-3">Send Reset Link</button>
          </form>
        </div>

        <p class="text-center mt-4 text-secondary">
          Remembered your password? <a href="login.html" class="text-primary fw-semibold">Sign In</a>
        </p>

      </div>
    </div>
  </div>

  <script type="module" src="js/auth-guard.js"></script>
  <script type="module">
    import { resetPassword, showAlert, setLoading } from './js/auth.js';

    const form = document.getElementById('resetForm');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();

      if (!email) {
        showAlert('alertContainer', 'Please enter your email address.');
        return;
      }

      setLoading(submitBtn, true, 'Send Reset Link');

      try {
        await resetPassword(email);
        setLoading(submitBtn, false, 'Send Reset Link');
        showAlert('alertContainer', 'Password reset email sent! Check your inbox.', 'success');
      } catch (err) {
        setLoading(submitBtn, false, 'Send Reset Link');
        showAlert('alertContainer', err.message.replace('Firebase: ', ''));
      }
    });
  </script>
</body>
</html>
