<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — Inkly</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:wght@700&display=swap" rel="stylesheet">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body class="d-flex align-items-center min-vh-100 py-5">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-5">
        
        <div class="text-center mb-4">
          <a class="brand-logo fs-1" href="index.html">Inkly<span>.</span></a>
          <h2 class="h4 fw-bold mt-3">Join our creative community</h2>
          <p class="text-secondary">Create an account to start writing and bookmarking stories.</p>
        </div>

        <div class="card p-4 border-0 shadow-lg rounded-4">
          <div id="alertContainer"></div>

          <form id="signupForm" novalidate>
            <div class="mb-3">
              <label class="form-label fw-medium">Full Name</label>
              <input type="text" id="fullName" class="form-control form-control-lg rounded-3" placeholder="Jane Doe" required>
            </div>

            <div class="mb-3">
              <label class="form-label fw-medium">Username</label>
              <input type="text" id="username" class="form-control form-control-lg rounded-3" placeholder="janedoe" required>
            </div>

            <div class="mb-3">
              <label class="form-label fw-medium">Email Address</label>
              <input type="email" id="email" class="form-control form-control-lg rounded-3" placeholder="jane@example.com" required>
            </div>

            <div class="mb-4">
              <label class="form-label fw-medium">Password</label>
              <input type="password" id="password" class="form-control form-control-lg rounded-3" placeholder="At least 6 characters" minlength="6" required>
            </div>

            <button type="submit" id="submitBtn" class="btn btn-inkly-primary w-100 py-3 mb-3">Create Account</button>
          </form>

          <div class="position-relative my-3 text-center">
            <hr class="text-muted">
            <span class="position-absolute top-50 start-50 translate-middle px-3 bg-surface text-muted small">OR</span>
          </div>

          <button id="googleBtn" class="btn btn-inkly-outline w-100 py-2.5 d-flex align-items-center justify-content-center gap-2">
            <i class="bi bi-google text-danger"></i> Continue with Google
          </button>
        </div>

        <p class="text-center mt-4 text-secondary">
          Already have an account? <a href="login.html" class="text-primary fw-semibold">Sign In</a>
        </p>

      </div>
    </div>
  </div>

  <script type="module" src="js/auth-guard.js"></script>
  <script type="module">
    import { registerUser, loginWithGoogle, showAlert, setLoading } from './js/auth.js';

    const form = document.getElementById('signupForm');
    const submitBtn = document.getElementById('submitBtn');
    const googleBtn = document.getElementById('googleBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('fullName').value.trim();
      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!name || !username || !email || !password) {
        showAlert('alertContainer', 'Please fill in all fields.');
        return;
      }

      setLoading(submitBtn, true, 'Create Account');

      try {
        await registerUser(name, username, email, password);
        window.location.href = 'dashboard.html';
      } catch (err) {
        setLoading(submitBtn, false, 'Create Account');
        showAlert('alertContainer', err.message.replace('Firebase: ', ''));
      }
    });

    googleBtn.addEventListener('click', async () => {
      try {
        await loginWithGoogle();
        window.location.href = 'dashboard.html';
      } catch (err) {
        showAlert('alertContainer', err.message.replace('Firebase: ', ''));
      }
    });
  </script>
</body>
</html>
